server:
  port: 8080

spring:
  application:
    name: Sable
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sable}
    username: ${DB_USER:sable}
    password: ${DB_PASSWORD:sable}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
  mapper-locations: classpath*:/mapper/**/*.xml

logging:
  level:
    me.kirara.sable: debug
