# ============================================================================
# 开发环境配置 —— 仅在启用 dev profile 时生效
# ============================================================================
# 启用方式（任选其一）：
#   SPRING_PROFILES_ACTIVE=dev java -jar sable-app/target/sable-app-0.0.1-SNAPSHOT.jar
#   ./mvnw -pl sable-app -am spring-boot:run -Dspring-boot.run.profiles=dev
#
# ⚠️ 生产环境不要启用本 profile。
#    它会把 db/dev/ 加进 Flyway 扫描路径，从而向目标库写入一批
#    **密码公开的演示账号**（见 db/dev/R__dev_seed.sql）。合规产品的生产库里
#    出现这种账号是严重缺陷，所以这个开关必须是"显式打开"而不是"默认开着"。
#
# 目前本文件只做这一件事。要加别的开发专用配置，请保持同样的克制：
# 只放"本地才会用到、生产不该有"的东西。
# ============================================================================

spring:
  flyway:
    # 必须把 db/migration 一并列全 —— 这个键是**整体覆盖**而非追加，
    # 只写 classpath:db/dev 会让正式迁移在 dev 下被静默跳过。
    locations: classpath:db/migration,classpath:db/dev

sable:
  tenant:
    # 启动时给库里已有的租户补齐 schema 与业务表。
    # 开发环境必须打开：种子数据（db/dev/R__dev_seed.sql）只写 public 下的 9 张公共表，
    # 而 12 张业务表是按"建租户"动作建到 tenant_{id} 里的 —— 不打开的话本地库重启后
    # 根本没有 tenant_1，一调业务接口就是 "relation data_source does not exist"。
    provision-on-startup: true

logging:
  level:
    # 开发时把本项目日志提到 DEBUG：MyBatis 的 SQL 语句、认证链路的中间判断都在这一级。
    # 生产保持 application.yml 里的 INFO —— 那里没有 SQL 输出。
    # 这也正是**不能**用 mybatis-plus 的 log-impl: StdOutImpl 的原因：
    # 那种写法无论在哪个环境都会把 SQL 打到 stdout，级别管不住。
    me.kirara.sable: debug
